<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Draft Seating">
<title>Magic Draft Seating</title>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 500; src: url(fonts/BC-Medium.ttf) format("truetype"); font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url(fonts/BC-SemiBold.ttf) format("truetype"); font-display: swap; }
  :root {
    --bg:#0e0e12; --panel:#17171d; --raise:#1f1f27; --line:#2b2b35;
    --ink:#f3f2f7; --muted:#8d8b9a; --accent:#a78bfa; --accent-ink:#0e0e12;
    --display:"Barlow Condensed", "Avenir Next Condensed", "Arial Narrow", sans-serif;
    --text:-apple-system, BlinkMacSystemFont, "Segoe UI", "Avenir Next", Roboto, sans-serif;
  }
  :root[data-theme="light"] {
    --bg:#f4f1ea; --panel:#fffdf8; --raise:#ffffff; --line:#e3ddd0;
    --ink:#16140f; --muted:#7a7468; --accent:#d4471a; --accent-ink:#ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) 18px 48px; }
  h1 { font-family:var(--display); font-weight:600; font-size: 40px; line-height: .95; letter-spacing: .2px; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 14px; line-height:1.4; margin: 0 0 20px; }
  textarea { width:100%; height: 132px; font: 15px/1.45 var(--text); padding: 14px; border:1px solid var(--line);
    border-radius: 14px; background: var(--panel); color: var(--ink); resize: vertical; outline: none; }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); opacity:.7; }
  .row { display:grid; grid-template-columns: 1fr auto auto; gap:8px; margin: 10px 0 0; }
  button { font: 600 15px var(--text); padding: 13px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--raise); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 16px; }
  button:active { transform: scale(.98); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin: 18px 0 0; }
  .chip { font: 500 14px var(--text); padding: 8px 11px; border-radius: 10px; background: transparent; color: var(--muted); }
  .chip b { color: var(--ink); font-weight: 600; margin-left: 4px; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .chip.on b { color: var(--accent); }
  .label { font-size: 12px; color: var(--muted); margin: 18px 2px 0; }
  #out { margin-top: 10px; border-radius: 18px; overflow: hidden; border:1px solid var(--line); }
  #out svg { width: 100%; height: auto; display: block; }
  .empty { color: var(--muted); text-align:center; padding: 56px 10px; font-size: 14px; background: var(--panel); }
</style>
</head>
<body>
<main>
  <h1>Magic Draft<br>Seating</h1>
  <p class="sub">Paste the draft list. Featured drafter sits at 12, everyone else follows clockwise in draft order.</p>

  <textarea id="list" placeholder="Paste the list here&#10;1 Samuel Chang&#10;2 Joao Quege&#10;…" autocomplete="off" spellcheck="false"></textarea>
  <div class="row">
    <button class="primary" id="share">Share</button>
    <button id="save">Save image</button>
    <button id="clear">Clear</button>
  </div>
  <div class="label" id="chipLabel" hidden>Featured drafter (tap to change)</div>
  <div class="chips" id="chips"></div>
  <div id="out"><div class="empty">The table appears here.</div></div>
</main>

  const FEATURE_RE = /\(?\s*featured(\s+drafter)?\s*\)?/i;
  let featuredOverride = null, lastSvg = null, fontCss = null;

  function titleCase(s) {
    if (s !== s.toUpperCase() && s !== s.toLowerCase()) return s;
    return s.toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
  }

  function parse(text) {
    const raw = text.split(/\r?\n/).map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
    const lines = [];
    for (let i = 0; i < raw.length; i++) {
      if (/^\d{1,2}[.)]?$/.test(raw[i]) && raw[i + 1] && !/^\d{1,2}[.)]?$/.test(raw[i + 1])) { lines.push(raw[i] + ' ' + raw[i + 1]); i++; }
      else lines.push(raw[i]);
    }
    const players = [];
    lines.forEach((line) => {
      const featured = FEATURE_RE.test(line);
      let s = line.replace(FEATURE_RE, '').trim();
      const m = s.match(/^(\d{1,2})[.)\-:]?\s+(.+)$/);
      const num = m ? parseInt(m[1], 10) : null;
      let name = (m ? m[2] : s).replace(/^[-•·*\s]+|[*\s]+$/g, '').trim();
      if (!name || /^\d+$/.test(name)) return;
      players.push({ num, name: titleCase(name), featured });
    });

    players.forEach((p, i) => { if (p.num == null) p.num = i + 1; });
    return players;
  }

  const esc = (s) => s.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  function render() {
    const players = parse(ta.value);
    chips.innerHTML = ''; $('chipLabel').hidden = players.length < 2;
    if (players.length < 2) { out.innerHTML = '<div class="empty">The table appears here.</div>'; lastSvg = null; return; }
    let f = players.findIndex(p => p.featured);
    if (featuredOverride != null && featuredOverride < players.length) f = featuredOverride;
    if (f < 0) f = 0;

    players.forEach((p, i) => {

    const n = players.length, W = 760, H = 540, cx = 380, cy = 300, R = 128, GAP = 26;

    for (let k = 0; k < n; k++) {
      const p = players[(f + k) % n];
      const a = -Math.PI / 2 + (2 * Math.PI * k) / n;
      const c = Math.cos(a), s = Math.sin(a), isF = k === 0;
      const sx = cx + R * c, sy = cy + R * s;
      const color = isF ? T.accent : T.ink;
      svg += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${isF ? 9 : 6}" fill="${isF ? T.accent : T.seat}" stroke="${T.bg}" stroke-width="3"/>`;
      // Label sits outside the seat; anchored away from the table so long names never cross it.
      const anchor = c > 0.25 ? 'start' : c < -0.25 ? 'end' : 'middle';
      const lx = cx + (R + GAP) * c, ly = cy + (R + GAP) * s;
      let y;
      if (anchor === 'middle') y = s < 0 ? ly - (isF ? 30 : 4) : ly + 26;
      else y = ly + 9 - (isF ? 10 : 0);
      svg += `<text x="${lx.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" font-size="31" font-weight="600" fill="${color}">`
           + `<tspan fill="${isF ? T.accent : T.muted}" font-weight="500">${p.num}</tspan><tspan dx="7">${esc(p.name)}</tspan></text>`;
      if (isF) svg += `<text x="${lx.toFixed(1)}" y="${(y + 26).toFixed(1)}" text-anchor="${anchor}" font-size="20" font-weight="500" letter-spacing="0.6" fill="${T.accent}">(Featured)</text>`;
    }
    svg += `</svg>`;
    out.innerHTML = svg; lastSvg = svg;
  }

  async function b64(url) {
    const buf = await (await fetch(url)).arrayBuffer();
    let bin = ''; const bytes = new Uint8Array(buf);
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }

  async function pngFile() {
    // Embed the font so the saved image looks the same on iPhone, Mac and PC.
    if (fontCss == null) {
      try {
        const [m, sb] = await Promise.all([b64('fonts/BC-Medium.ttf'), b64('fonts/BC-SemiBold.ttf')]);
        fontCss = `@font-face{font-family:"Barlow Condensed";font-weight:500;src:url(data:font/ttf;base64,${m})}`
                + `@font-face{font-family:"Barlow Condensed";font-weight:600;src:url(data:font/ttf;base64,${sb})}`;
      } catch (e) { fontCss = ''; }
    }
    const svg = lastSvg.replace(/(<svg[^>]*>)/, `$1<style>${fontCss}</style>`);
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();
    await new Promise(r => setTimeout(r, 60));
    const cv = document.createElement('canvas'); cv.width = 1520; cv.height = 1080;
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    return new File([blob], 'draft-seating.png', { type: 'image/png' });
  }

  function download(file) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  }

  async function share() {
    if (!lastSvg) { ta.focus(); return; }
    const file = await pngFile();
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    download(file);
  }

  ta.addEventListener('input', () => { featuredOverride = null; render(); });
  $('share').onclick = share;
  $('save').onclick = async () => { if (lastSvg) download(await pngFile()); };
  $('clear').onclick = () => { ta.value = ''; featuredOverride = null; render(); ta.focus(); };
  render();
})();
</script>
</body>
</html>
